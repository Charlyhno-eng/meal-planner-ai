[project]
name = "meal-planner-ai"
version = "0.1.0"
description = "Local meal and grocery planning desktop application"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "langgraph>=1,<2",
    "onnx-asr[cpu]>=0.10,<0.11",
    "pydantic>=2,<3",
    "pyside6>=6.8,<7",
]

[project.scripts]
meal-planner-ai = "src.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
